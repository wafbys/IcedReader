[workspace]
members = ["src-tauri", "crates/core", "crates/formats-epub"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/icedreader/icedreader"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
