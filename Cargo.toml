[workspace]
members = ["src-tauri", "crates/core", "crates/formats-epub"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/icedreader/icedreader"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
